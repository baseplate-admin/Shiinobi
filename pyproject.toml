[project]
name = "shiinobi"
version = "0.0.1"
description = ""
authors = [
    { name = "baseplate-admin", email = "61817579+baseplate-admin@users.noreply.github.com" },
]
requires-python = ">=3.9,<3.14"
readme = "README.md"
license = "MIT"
maintainers = [
    { name = "baseplate-admin", email = "61817579+baseplate-admin@users.noreply.github.com" },
]
dependencies = [
    "selectolax>=0.4.10,<0.5",
    "requests-cache>=1.3.2,<2",
    "requests-ratelimiter>=0.8.0,<0.9",
    "python-dateutil>=2.9.0.post0",
    "pyinstaller-hooks-contrib~=2026.6",
    "cloudscraper>=1.2.71",
]

[dependency-groups]
cli = ["typer>=0.23.2,<0.24"]
docs = [
    "sphinx>=8.1.3,<9",
    "myst-parser>=4.0.1",
    "sphinx-reload>=0.2.0,<0.3",
    "shibuya>=2026.7.12,<2027",
]
dev = [
    "poethepoet>=0.48.0,<0.49",
    "ruff>=0.15.20,<0.16",
    "pyinstaller>=6.21.0,<7",
    "pillow>=12.2.0,<13",
    "mypy>=2.2.0,<3",
    "types-python-dateutil>=2.9.0.20260518,<3",
    "types-requests>=2.33.0.20260712,<3",
    "types-pyinstaller>=6.21.0.20260616,<7",
]

[tool.uv]
default-groups = ["cli", "docs", "dev"]

[tool.hatch.build.targets.sdist]
include = ["./src/shiinobi"]
# exclude = ["src/shiinobi/cli.py"]

[tool.hatch.build.targets.wheel]
include = ["./src/shiinobi"]
# exclude = ["src/shiinobi/cli.py"]

[tool.hatch.build.targets.wheel.sources]
"./src/shiinobi" = "shiinobi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
"dev-cli" = "python ./src/cli.py"
"build-cli" = "pyinstaller ./cli.spec --clean"
